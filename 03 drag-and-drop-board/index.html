<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Drag and Drop Board</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<main class="board">
		<section class="board__column" aria-labelledby="todo-title">
			<header class="board__header">
				<h2 id="todo-title">Todo</h2>
			</header>
			<ul class="board__list" aria-label="Todo tasks">
				<li class="board__card" draggable="true">Sketch the app layout</li>
				<li class="board__card" draggable="true">Define board data model</li>
				<li class="board__card" draggable="true">Create initial HTML structure</li>
			</ul>
		</section>

		<section class="board__column" aria-labelledby="progress-title">
			<header class="board__header">
				<h2 id="progress-title">In Progress</h2>
			</header>
			<ul class="board__list" aria-label="In Progress tasks">
				<li class="board__card" draggable="true">Style the board columns</li>
				<li class="board__card" draggable="true">Polish spacing and typography</li>
			</ul>
		</section>

		<section class="board__column" aria-labelledby="complete-title">
			<header class="board__header">
				<h2 id="complete-title">Complete</h2>
			</header>
			<ul class="board__list" aria-label="Complete tasks">
				<li class="board__card" draggable="true">Set up project structure</li>
				<li class="board__card" draggable="true">Add base CSS reset</li>
			</ul>
		</section>
	</main>
</body>
</html>
