<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Bookmark Saver</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
       <h1>Bookmark Saver</h1>
       <form id="add-bookmark-form" class="bookmark-form">
         <input type="text" id="bookmark-name" placeholder="Bookmark Name" />
         <input type="text" id="bookmark-url" placeholder="Bookmark URL" />
         <button type="submit" id="add-bookmark">Add Bookmark</button>
       </form>

       <ul id="bookmark-list"></ul>
     </div>

    <script type="module" src="script.js"></script>
</body>
</html>
